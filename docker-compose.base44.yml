services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  node_modules:
  app_data:
